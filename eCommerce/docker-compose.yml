services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    container_name: wildnest-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1435:1433"
    expose:
      - "1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wildnest-rabbitmq
    hostname: rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Local mailbox for notification and password-reset emails. Open http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: wildnest-mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    image: wildnest-api:1.0.0
    build:
      context: .
      dockerfile: eCommerce.WebAPI/Dockerfile
    container_name: wildnest-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5126
      RABBITMQ_HOSTNAME: rabbitmq
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
    ports:
      - "5126:5126"
    depends_on:
      sql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Separate subscriber process - consumption must NOT live inside eCommerce.WebAPI.
  subscriber:
    image: wildnest-subscriber:1.0.0
    build:
      context: .
      dockerfile: eCommerce.Subscriber/Dockerfile
    container_name: wildnest-subscriber
    env_file:
      - .env
    environment:
      RABBITMQ_HOSTNAME: rabbitmq
      ConnectionStrings__DefaultConnection: Server=sql,1433;Database=${DB_NAME};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@wildnest.local
      SMTP_ENABLE_SSL: "false"
    depends_on:
      rabbitmq:
        condition: service_healthy
      sql:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  sqlserver_data:
