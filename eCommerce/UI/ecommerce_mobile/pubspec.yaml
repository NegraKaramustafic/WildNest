name: ecommerce_mobile
description: "WildNest mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.6.0
  json_annotation: ^4.11.0
  flutter_form_builder: ^10.3.0+2
  jwt_decoder: ^2.0.1
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  app_links: ^6.4.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.13.1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
